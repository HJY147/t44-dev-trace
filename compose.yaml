name: ${COMPOSE_PROJECT_NAME:-t44}

x-application: &application
  image: t44-backend:${T44_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: deployment/api.Dockerfile
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  networks: [data]
  environment: &application-environment
    PYTHONPATH: /app/backend
    DATABASE_URL: mysql+pymysql://${MYSQL_USER:-t44}:${MYSQL_PASSWORD:?Generate .env first}@mysql:3306/${MYSQL_DATABASE:?Select database}
    T44_DATABASE: ${MYSQL_DATABASE:?Select database}
    AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-t44}:${RABBITMQ_DEFAULT_PASS:?Generate .env first}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-t44}
    T44_SESSION_TTL_SECONDS: ${T44_SESSION_TTL_SECONDS:-3600}
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  mysql:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Select database}
      MYSQL_USER: ${MYSQL_USER:-t44}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Generate .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env first}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci]
    volumes: [mysql_data:/var/lib/mysql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --user=root --database="$$MYSQL_DATABASE" --execute="SELECT 1" --silent >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:0452ee3fd3b9a74160b251e693338616b464f22df4d4ba43304c101bebdca292
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-t44}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Generate .env first}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-t44}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [data]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  api:
    <<: *application
    command: [python, -m, uvicorn, 't44.api:app', --host, 0.0.0.0, --port, "8000", --workers, "4", --no-access-log, --no-proxy-headers]
    networks: [data, application]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /app/deployment/runtime_probe.py, api]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s

  consumer:
    <<: *application
    command: [python, -m, t44.messaging]
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /app/deployment/runtime_probe.py, consumer]
      interval: 20s
      timeout: 8s
      retries: 3

  scheduler:
    <<: *application
    command: [python, -m, t44.scheduling]
    environment:
      <<: *application-environment
      T44_SCHEDULER_TOKEN_FILE: /run/t44-secrets/scheduler-token.json
      T44_SCHEDULER_LOCK_FILE: /var/lib/t44-scheduler/scan.lock
    volumes:
      - scheduler_secrets:/run/t44-secrets:ro
      - scheduler_locks:/var/lib/t44-scheduler
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /app/deployment/runtime_probe.py, scheduler]
      interval: 20s
      timeout: 8s
      retries: 3

  migrate:
    <<: *application
    profiles: [operations]
    restart: "no"
    entrypoint: [python, -m, t44.cli]
    command: [migrate, --database, '${MYSQL_DATABASE:?Select database}']
    depends_on:
      mysql: {condition: service_healthy}

  admin:
    <<: *application
    profiles: [operations]
    restart: "no"
    entrypoint: [python, -m, t44.cli]
    command: [--help]
    depends_on:
      mysql: {condition: service_healthy}

  credential-admin:
    <<: *application
    profiles: [operations]
    restart: "no"
    entrypoint: [python, /app/deployment/credential_admin.py]
    command: [--help]
    volumes: [scheduler_secrets:/run/t44-secrets]
    depends_on:
      mysql: {condition: service_healthy}

  web:
    image: t44-web:${T44_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deployment/web.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:${T44_HTTP_PORT:-8080}:8080']
    networks: [edge, application]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/']
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  mysql_data:
  rabbitmq_data:
  scheduler_secrets:
  scheduler_locks:

networks:
  data: {internal: true}
  application: {internal: true}
  edge:
