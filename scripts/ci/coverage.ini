[run]
branch = True
source = backend/t44
relative_files = True
[report]
# The gate checks line coverage in JSON. Branch coverage is reported, not an extra threshold.
fail_under = 0
precision = 2
show_missing = True
skip_empty = False
exclude_lines =
[xml]
output = reports/ci/coverage/coverage.xml
[json]
output = reports/ci/coverage/coverage.json
[html]
directory = reports/ci/coverage/html
