<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1550" viewBox="0 0 2200 1550"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">扫描恢复与异步消息确认</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">发布确认与消费处理是独立链路；consumer在数据库提交后ACK</text><rect x="70" y="230" width="440" height="170" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="290.0" y="291.88" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">恢复同规则旧run</text><text x="290.0" y="338.12" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">保留started/cursor</text><rect x="610" y="230" width="440" height="170" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="830.0" y="291.88" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">顺序keyset取候选</text><text x="830.0" y="338.12" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">每候选动态读token</text><rect x="1150" y="230" width="440" height="170" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1370.0" y="291.88" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">Runtime幂等执行</text><text x="1370.0" y="338.12" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">升级事件与outbox</text><rect x="1690" y="230" width="440" height="170" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1910.0" y="291.88" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">逐任务checkpoint</text><text x="1910.0" y="338.12" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">空页后完成</text><polyline points="510,315 610,315" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="610,315 589.9120433131292,323.97072996731055 589.9120433131292,306.02927003268945" fill="#087f8c"/><polyline points="1050,315 1150,315" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1150,315 1129.9120433131293,323.97072996731055 1129.9120433131293,306.02927003268945" fill="#087f8c"/><polyline points="1590,315 1690,315" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1690,315 1669.9120433131293,323.97072996731055 1669.9120433131293,306.02927003268945" fill="#087f8c"/><rect x="60" y="670" width="560" height="190" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="340.0" y="717.4" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">Publisher</text><text x="340.0" y="765.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">短事务领取outbox租约</text><text x="340.0" y="812.6" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">网络调用不持DB事务</text><rect x="830" y="670" width="540" height="190" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="738.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="39" fill="#173651">RabbitMQ</text><text x="1100.0" y="791.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="39" fill="#173651">持久消息与路由</text><rect x="1580" y="670" width="560" height="190" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1860.0" y="716.04" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">Consumer</text><text x="1860.0" y="765.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">去重 通知写入</text><text x="1860.0" y="813.96" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">数据库事务提交</text><polyline points="620,710 830,710" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="830,710 809.9120433131292,718.9707299673105 809.9120433131292,701.0292700326895" fill="#087f8c"/><text x="720" y="660.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">publish</text><polyline points="830,820 620,820" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="620,820 640.0879566868708,811.0292700326895 640.0879566868708,828.9707299673105" fill="#087f8c"/><text x="710" y="920.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">confirm → 登记发布确认</text><polyline points="1370,710 1580,710" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1580,710 1559.9120433131293,718.9707299673105 1559.9120433131293,701.0292700326895" fill="#087f8c"/><text x="1475" y="660.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">delivery</text><polyline points="1580,820 1370,820" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1370,820 1390.0879566868707,811.0292700326895 1390.0879566868707,828.9707299673105" fill="#087f8c"/><text x="1480" y="920.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">提交后 ACK</text><rect x="160" y="1150" width="1880" height="170" rx="20" fill="#fff5e8" stroke="#b65d19" stroke-width="3"/><text x="1100.0" y="1210.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">MQ不可用：升级通知转为有标记的站内待办；普通事件按原策略重试</text><text x="1100.0" y="1259.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">丢ACK可重投，DB唯一约束与消费事务去重；发布确认不等于消费完成</text><polyline points="340,860 340,1150" fill="none" stroke="#b65d19" stroke-width="4"/><polygon points="340,1150 331.02927003268945,1129.9120433131293 348.97072996731055,1129.9120433131293" fill="#b65d19"/><text x="520" y="1040.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#b65d19">发布失败</text><text x="65" y="1490" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="29" fill="#526575">上下两行是扫描与消息处理两个阶段视图，不把DB与MQ画成一个分布式原子事务。</text></svg>