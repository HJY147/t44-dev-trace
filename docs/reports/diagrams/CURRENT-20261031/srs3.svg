<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1300" viewBox="0 0 2200 1300"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">业务对象与规则组织</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">对象间的关联用于解释业务责任，不表示按框逐一执行</text><rect x="830" y="240" width="540" height="150" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="289.15999999999997" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">项目与迭代</text><text x="1100.0" y="340.84" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">成员 计划 工时</text><rect x="830" y="620" width="540" height="170" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="679.16" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">交付任务</text><text x="1100.0" y="730.8399999999999" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">状态 版本 责任人</text><polyline points="1100,390 1100,620" fill="none" stroke="#087f8c" stroke-width="4"/><text x="1300" y="510.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">归属与排期</text><rect x="70" y="620" width="540" height="170" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="340.0" y="680.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">任务依赖</text><text x="340.0" y="729.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">同项目 无环 前驱交付</text><rect x="1590" y="620" width="540" height="170" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1860.0" y="680.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">评审与上线评估</text><text x="1860.0" y="729.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">证据 周期 版本</text><rect x="830" y="1000" width="540" height="170" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="1060.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">决定与审计</text><text x="1100.0" y="1109.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">拍板人 原因 结果</text><polyline points="610,705 830,705" fill="none" stroke="#087f8c" stroke-width="4"/><text x="720" y="650.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">前置条件</text><polyline points="1370,705 1590,705" fill="none" stroke="#087f8c" stroke-width="4"/><text x="1480" y="650.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">有效证明</text><polyline points="1100,790 1100,1000" fill="none" stroke="#087f8c" stroke-width="4"/><text x="1280" y="900.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">可追溯</text><text x="65" y="1240" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="29" fill="#526575">任务状态权威在服务端；通知处理不会自动替代任务流转或经理决定。</text></svg>