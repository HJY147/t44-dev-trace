<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1450" viewBox="0 0 2200 1450"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">有序锁与依赖防环算法</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">锁定顺序与图遍历是两类约束，不能把CAS直接放在成员锁之后</text><rect x="70" y="220" width="1080" height="115" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="610.0" y="277.5" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">session共享锁（logout更新锁）</text><polyline points="610,335 610,385" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="610,385 601.0292700326895,364.91204331312923 618.9707299673105,364.91204331312923" fill="#087f8c"/><rect x="70" y="385" width="1080" height="115" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="610.0" y="442.5" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">幂等作用域锁与owner fence</text><polyline points="610,500 610,550" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="610,550 601.0292700326895,529.9120433131292 618.9707299673105,529.9120433131292" fill="#087f8c"/><rect x="70" y="550" width="1080" height="115" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="610.0" y="607.5" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">按操作取项目share或update锁</text><polyline points="610,665 610,715" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="610,715 601.0292700326895,694.9120433131292 618.9707299673105,694.9120433131292" fill="#087f8c"/><rect x="70" y="715" width="1080" height="115" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="610.0" y="772.5" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">按user_id有序锁成员</text><polyline points="610,830 610,880" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="610,880 601.0292700326895,859.9120433131292 618.9707299673105,859.9120433131292" fill="#087f8c"/><rect x="70" y="880" width="1080" height="115" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="610.0" y="937.5" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">任务唯一PK按id排序逐一锁定</text><polyline points="610,995 610,1045" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="610,1045 601.0292700326895,1024.9120433131293 618.9707299673105,1024.9120433131293" fill="#087f8c"/><rect x="70" y="1045" width="1080" height="115" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="610.0" y="1102.5" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="35" fill="#173651">领域决定与expected_version CAS</text><rect x="1390" y="320" width="720" height="230" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1750.0" y="384.68" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="37" fill="#173651">项目邻接表</text><text x="1750.0" y="435.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="37" fill="#173651">K个新增前驱分别DFS</text><text x="1750.0" y="485.32" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="37" fill="#173651">遇目标即拒绝成环</text><rect x="1390" y="780" width="720" height="230" rx="20" fill="#fff5e8" stroke="#b65d19" stroke-width="3"/><text x="1750.0" y="844.68" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="37" fill="#173651">最坏 O(K(N+E))</text><text x="1750.0" y="895.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="37" fill="#173651">空间 O(N+E)</text><text x="1750.0" y="945.32" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="37" fill="#173651">数据库索引与锁等待另计</text><polyline points="1750,550 1750,780" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1750,780 1741.0292700326895,759.9120433131292 1758.9707299673105,759.9120433131292" fill="#087f8c"/><text x="65" y="1390" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="29" fill="#526575">N为项目任务数、E为依赖边、K为新增前驱数；当前算法各前驱重置visited，不能写成一次O(N+E)。</text></svg>