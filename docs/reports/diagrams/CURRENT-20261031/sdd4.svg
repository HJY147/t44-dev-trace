<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1350" viewBox="0 0 2200 1350"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">转换准入与拒绝出口</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">固定守卫、领域决定和持久化有明确先后；不把前端按钮视为权限检查</text><rect x="80" y="260" width="500" height="180" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="330.0" y="324.15999999999997" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">请求与当前身份</text><text x="330.0" y="375.84" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">冻结输入校验</text><rect x="840" y="260" width="540" height="180" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1110.0" y="324.15999999999997" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">当前证明与有序锁</text><text x="1110.0" y="375.84" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">角色 版本 状态 依赖</text><rect x="1640" y="260" width="480" height="180" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1880.0" y="324.15999999999997" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">纯状态机 decide</text><text x="1880.0" y="375.84" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">Decision 或违例</text><polyline points="580,350 840,350" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="840,350 819.9120433131292,358.97072996731055 819.9120433131292,341.02927003268945" fill="#087f8c"/><polyline points="1380,350 1