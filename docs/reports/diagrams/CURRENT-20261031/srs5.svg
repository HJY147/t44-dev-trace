<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">上线评估与经理决定</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">仅在原批准引用不匹配的分支细化D008错误顺序</text><rect x="760" y="230" width="680" height="130" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="295.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">已通过鉴权 归属 版本 状态守卫</text><rect x="760" y="480" width="680" height="130" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="545.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">本次评估与原批准引用是否匹配</text><polyline points="1100,360 1100,480" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,480 1091.0292700326895,459.91204331312923 1108.9707299673105,459.91204331312923" fill="#087f8c"/><rect x="60" y="800" width="900" height="180" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="510.0" y="864.16" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">匹配：沿用原领域校验顺序</text><text x="510.0" y="915.8399999999999" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">评估 预案 证据 独立责任</text><rect x="1240" y="800" width="900" height="180" rx="20" fill="#fff5e8" stroke="#b65d19" stroke-width="3"/><text x="1690.0" y="865.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">不匹配：本次评估基线是否失效</text><text x="1690.0" y="914.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">失效先更新评估，否则需重新批准</text><polyline points="900,610 900,700 510,700 510,800" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="510,800 501.02927003268945,779.9120433131292 518.9707299673105,779.9120433131292" fill="#087f8c"/><text x="650" y="655.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">是</text><polyline points="1300,610 1300,700 1690,700 1690,800" fill="none" stroke="#b65d19" stroke-width="4"/><polygon points="1690,800 1681.0292700326895,779.9120433131292 1698.9707299673105,779.9120433131292" fill="#b65d19"/><text x="1600" y="655.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#b65d19">否</text><rect x="650" y="1180" width="900" height="150" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="1229.16" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">有效评估与独立复核齐备后</text><text x="1100.0" y="1280.8400000000001" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">经理逐单决定发布或按绑定预案回滚</text><polyline points="510,980 510,1255 650,1255" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="650,1255 629.9120433131292,1263.9707299673105 629.9120433131292,1246.0292700326895" fill="#087f8c"/><polyline points="1690,980 2160,980 2160,295 1440,295" fill="none" stroke="#b65d19" stroke-width="4"/><polygon points="1440,295 1460.0879566868707,286.02927003268945 1460.0879566868707,303.97072996731055" fill="#b65d19"/><text x="1920" y="1120.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#b65d19">修正后重新请求</text><text x="65" y="1440" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="29" fill="#526575">D008不把评估检查移到鉴权之前；新评估不能跳过独立评审，图不授予自动发布权限。</text></svg>