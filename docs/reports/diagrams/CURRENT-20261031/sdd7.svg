<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1450" viewBox="0 0 2200 1450"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">前端会话与迟到响应隔离</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">每次身份变化更新会话代次；旧响应不得回写新工作区</text><rect x="70" y="230" width="460" height="120" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="300.0" y="290.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="43" fill="#173651">用户界面</text><polyline points="300,350 300,1230" fill="none" stroke="#526575" stroke-width="2"/><rect x="870" y="230" width="460" height="120" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="290.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="43" fill="#173651">会话与工作区</text><polyline points="1100,350 1100,1230" fill="none" stroke="#526575" stroke-width="2"/><rect x="1670" y="230" width="460" height="120" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1900.0" y="290.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="43" fill="#173651">API</text><polyline points="1900,350 1900,1230" fill="none" stroke="#526575" stroke-width="2"/><polyline points="300,460 1100,460" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,460 1079.9120433131293,468.97072996731055 1079.9120433131293,451.02927003268945" fill="#087f8c"/><text x="700.0" y="420.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">发起请求，携带当前代次</text><polyline points="1100,620 1900,620" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1900,620 1879.9120433131293,628.9707299673105 1879.9120433131293,611.0292700326895" fill="#087f8c"/><text x="1500.0" y="580.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">使用当前会话发送</text><polyline points="300,800 1100,800" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,800 1079.9120433131293,808.9707299673105 1079.9120433131293,791.0292700326895" fill="#087f8c"/><text x="700.0" y="760.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">退出成功或当前401：清身份并卸载</text><polyline points="1900,980 1100,980" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,980 1120.0879566868707,971.0292700326895 1120.0879566868707,988.9707299673105" fill="#087f8c"/><text x="1500.0" y="940.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">旧请求迟到：响应代次已失效</text><polyline points="1100,1140 300,1140" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="300,1140 320.08795668687077,1131.0292700326895 320.08795668687077,1148.9707299673105" fill="#087f8c"/><text x="700.0" y="1100.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="30" fill="#087f8c">丢弃旧回调，不刷新新表单</text><text x="65" y="1390" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="29" fill="#526575">退出失败保留当前身份；卸载页面不等于撤销服务端已发出的写事务。</text></svg>