<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1450" viewBox="0 0 2200 1450"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">前后端分离的单体分层</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">独立进程用于持续工作，不表示业务微服务拆分</text><rect x="580" y="240" width="1040" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="310.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="44" fill="#173651">Vue前端与HTTPS入口</text><rect x="580" y="480" width="1040" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="550.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="44" fill="#173651">API 鉴权与契约边界</text><rect x="580" y="720" width="1040" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="790.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="44" fill="#173651">Runtime + 领域服务 + UoW</text><rect x="580" y="960" width="1040" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="1030.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="44" fill="#173651">MySQL 参数化持久层</text><polyline points="1100,380 1100,480" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,480 1091.0292700326895,459.91204331312923 1108.9707299673105,459.91204331312923" fill="#087f8c"/><polyline points="1100,620 1100,720" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,720 1091.0292700326895,699.9120433131292 1108.9707299673105,699.9120433131292" fill="#087f8c"/><polyline points="1100,860 1100,960" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,960 1091.0292700326895,939.9120433131292 1108.9707299673105,939.9120433131292" fill="#087f8c"/><rect x="60" y="720" width="400" height="290" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="260.0" y="818.76" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">APScheduler</text><text x="260.0" y="865.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">Scanner</text><text x="260.0" y="911.24" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="34" fill="#173651">调用原Runtime</text><polyline points="460,850 580,850" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="580,850 559.9120433131292,858.9707299673105 559.9120433131292,841.0292700326895" fill="#087f8c"/><rect x="1740" y="720" width="400" height="380" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1940.0" y="842.68" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="33" fill="#173651">消息工作进程</text><text x="1940.0" y="887.56" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="33" fill="#173651">Outbox / Consumer</text><text x="1940.0" y="932.4399999999999" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="33" fill="#173651">RabbitMQ</text><text x="1940.0" y="977.3199999999999" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="33" fill="#173651">事务后确认</text><polyline points="1620,1020 1740,1020" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1740,1020 1719.9120433131293,1028.9707299673105 1719.9120433131293,1011.0292700326895" fill="#087f8c"/><text x="65" y="1390" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="29" fill="#526575">所有业务状态由领域决定并经事务提交；前端、调度和消息进程不能绕过业务门面直接改状态。</text></svg>