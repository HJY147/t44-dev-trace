<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">幂等请求与owner fencing</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">业务幂等键与运输nonce不同；摘要、租约与owner共同防止重复生效</text><rect x="780" y="230" width="640" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="274.15999999999997" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">鉴权与输入校验后</text><text x="1100.0" y="325.84" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">独立claim事务锁定作用域</text><rect x="60" y="650" width="600" height="190" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="360.0" y="720.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">同键同摘要且COMPLETE</text><text x="360.0" y="769.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">返回原业务结果</text><rect x="800" y="650" width="600" height="190" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="720.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">新键或过期租约</text><text x="1100.0" y="769.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">取得owner后主事务</text><rect x="1540" y="650" width="600" height="190" rx="20" fill="#fff5e8" stroke="#b65d19" stroke-width="3"/><text x="1840.0" y="720.52" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">同键异摘要 / 活跃租约</text><text x="1840.0" y="769.48" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="36" fill="#173651">冲突 / IN_PROGRESS</text><polyline points="1100,370 1100,500 360,500 360,650" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="360,650 351.02927003268945,629.9120433131292 368.97072996731055,629.9120433131292" fill="#087f8c"/><polyline points="1100,370 1100,500 1100,500 1100,650" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,650 1091.0292700326895,629.9120433131292 1108.9707299673105,629.9120433131292" fill="#087f8c"/><polyline points="1100,370 1100,500 1840,500 1840,650" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1840,650 1831.0292700326895,629.9120433131292 1848.9707299673105,629.9120433131292" fill="#087f8c"/><rect x="800" y="1110" width="600" height="190" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1100.0" y="1179.84" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="37" fill="#173651">主事务再核owner</text><text x="1100.0" y="1230.1599999999999" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="37" fill="#173651">业务与COMPLETE同提交</text><polyline points="1100,840 1100,1110" fill="none" stroke="#087f8c" stroke-width="4"/><polygon points="1100,1110 1091.0292700326895,1089.9120433131293 1108.9707299673105,1089.9120433131293" fill="#087f8c"/><text x="65" y="1440" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="29" fill="#526575">重放不再次执行业务写和成功审计；owner丢失、5xx与提交不明不能统称成功COMPLETE。</text></svg>