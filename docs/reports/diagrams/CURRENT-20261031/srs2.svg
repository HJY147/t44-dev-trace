<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400"><polyline points="50,35 2150,35" fill="none" stroke="#087f8c" stroke-width="9"/><text x="65" y="95" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="56" fill="#173651">角色与主要用例</text><text x="65" y="160" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="31" fill="#526575">连线表示参与；每个动作仍受项目范围、版本、状态及独立责任约束</text><rect x="100" y="340" width="340" height="130" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="270.0" y="405.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">经理</text><rect x="100" y="670" width="340" height="130" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="270.0" y="735.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">开发人员</text><rect x="100" y="1000" width="340" height="130" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="270.0" y="1065.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="38" fill="#173651">评审人员</text><rect x="800" y="240" width="1050" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1325.0" y="310.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="40" fill="#173651">项目 排期 人力与依赖</text><rect x="800" y="500" width="1050" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1325.0" y="570.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="40" fill="#173651">接手 阻塞 提交评审</text><rect x="800" y="760" width="1050" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1325.0" y="830.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="40" fill="#173651">证据评审 与不通过意见</text><rect x="800" y="1020" width="1050" height="140" rx="20" fill="#eef7f8" stroke="#087f8c" stroke-width="3"/><text x="1325.0" y="1090.0" text-anchor="middle" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="40" fill="#173651">上线评估 发布与回滚</text><polyline points="440,405 620,405 620,310 800,310" fill="none" stroke="#087f8c" stroke-width="3"/><polyline points="440,405 540,405 540,1090 800,1090" fill="none" stroke="#087f8c" stroke-width="3"/><polyline points="440,735 700,735 700,570 800,570" fill="none" stroke="#087f8c" stroke-width="3"/><polyline points="440,1065 660,1065 660,830 800,830" fill="none" stroke="#087f8c" stroke-width="3"/><text x="65" y="1340" text-anchor="start" dominant-baseline="middle" font-family="Heiti SC,sans-serif" font-size="29" fill="#526575">评审批准不得本人自审；开发阶段动作要求开发者且为负责人，其他阶段按冻结角色规则。</text></svg>