name: offline-backend-source-f4

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-backend-source-f4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fixed public source objects, frozen equality and allowlisted artifact only
        shell: bash
        run: bash deployment/cloud-reuse/prepare-source-artifact.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-backend-source-f4-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/t44-f4-source-artifact/source-backend.tar.gz
            ${{ runner.temp }}/t44-f4-source-artifact/source-manifest.json
            ${{ runner.temp }}/t44-f4-source-artifact/frozen-equality.json
            ${{ runner.temp }}/t44-f4-source-artifact/Dockerfile
            ${{ runner.temp }}/t44-f4-source-artifact/backend-upgrade.py
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
