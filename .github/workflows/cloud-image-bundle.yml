name: cloud-image-bundle

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed 40-character product commit (build only; not release approval)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-image-bundle-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Fetch only the exact product source
        env:
          T44_PRODUCT_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$T44_PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          timeout --signal=TERM --kill-after=10s 120s git fetch --no-tags --depth=1 origin "$T44_PRODUCT_SHA"
          test "$(git rev-parse "${T44_PRODUCT_SHA}^{commit}")" = "$T44_PRODUCT_SHA"
      - name: Build exact runtime context and official pinned Linux amd64 images
        env:
          T44_PRODUCT_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python deployment/cloud-reuse/image-bundle.py build \
            --repository "$GITHUB_WORKSPACE" --source-sha "$T44_PRODUCT_SHA" \
            --output "$RUNNER_TEMP/t44-image-bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloud-images-${{ inputs.source_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/t44-image-bundle/bundle-manifest.json
            ${{ runner.temp }}/t44-image-bundle/images.tar.gz
            ${{ runner.temp }}/t44-image-bundle/source-runtime-context.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: cloud-image-build-failure-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/t44-image-bundle/build-failure.json
          if-no-files-found: warn
          retention-days: 7
