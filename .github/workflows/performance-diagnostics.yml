name: performance-diagnostics

on:
  push:
    branches: [codex/diagnostics-20261025]
    paths: [records/diagnostics/20261025/request-before.json]

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sequential-mysql-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: mysql+pymysql://t44:diag-app-disposable@127.0.0.1:3306/t44_diagnostics
      T44_DATABASE: t44_diagnostics
      AMQP_URL: amqp://unused:unused@127.0.0.1:5672/t44_diagnostics
    services:
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: diag-root-disposable
          MYSQL_DATABASE: t44_diagnostics
          MYSQL_USER: t44
          MYSQL_PASSWORD: diag-app-disposable
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd "MYSQL_PWD=diag-root-disposable mysql --protocol=tcp --host=127.0.0.1 --user=root --execute='SELECT 1' --silent"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify exact source, admission, tool hashes and local target before application work
        run: python tmp/831_diagnostic_admission/831_admission.py
      - name: Install existing hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements.lock
          python -m pip install --require-hashes -r backend/requirements.lock
      - name: Migrate only the fresh dedicated database
        run: python -m t44.cli migrate --database t44_diagnostics
      - name: Run one explicitly bounded sequential CPU and SQL profile
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=5s 210s python tmp/834_backend_performance/834_request_profile.py \
            --run --expected-source "$GITHUB_SHA" --mode mysql --allow-mysql-ci \
            --expected-database t44_diagnostics --samples 12 \
            --db-observer tmp/833_database_performance/833_database_trace.py \
            --observer-sha256 4edbf24779794a826bbe754ccad26890ea4c5c1d3f13f05778bad0e52ec307a9 \
            --output agents/backend/performance-20261025/mysql-before.json \
            2>&1 | tee reports/diagnostics/console-before.log
      - name: Preserve fresh MySQL service log
        if: always()
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
        run: |
          mkdir -p reports/diagnostics
          docker logs "$MYSQL_SERVICE_ID" > reports/diagnostics/mysql-service.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: diagnostics-before-${{ github.sha }}
          path: |
            reports/diagnostics/
            agents/backend/performance-20261025/mysql-before.json
          if-no-files-found: error
          retention-days: 30
