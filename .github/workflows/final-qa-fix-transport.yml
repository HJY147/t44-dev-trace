name: final-qa-fix-transport
on:
  push:
    branches: [codex/resume-coordination-20261029]
    paths: [.github/workflows/final-qa-fix-transport.yml]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-qa-fix-${{ github.run_id }}
          path: records/independent-qa/f-param-fix-01/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
