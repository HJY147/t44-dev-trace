name: product

on:
  pull_request:
    branches: [main, codex/team-bootstrap]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare raw evidence directory
        run: mkdir -p reports/ci
      - name: Install hash-locked checking tools
        run: python -m pip install --require-hashes -r scripts/ci/requirements.lock
      - name: Validate Compose with placeholders and Nginx syntax in official container
        shell: bash
        run: |
          docker compose --env-file deployment/.env.example config --quiet
          docker run --rm --network none --add-host api:127.0.0.1 --read-only --tmpfs /tmp \
            --volume "$PWD/deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --volume "$PWD/deployment/nginx/api.conf:/etc/nginx/t44-api.conf:ro" \
            --entrypoint nginx \
            nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951 \
            -t 2>&1 | tee reports/ci/nginx-syntax.log
      - name: Check configuration, Python static rules and implementation presence
        shell: bash
        run: python scripts/ci/static.py 2>&1 | tee reports/ci/static-console.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: static-${{ github.sha }}
          path: reports/ci/
          if-no-files-found: error
          retention-days: 14

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: mysql+pymysql://t44:ci-app-disposable@127.0.0.1:3306/t44_ci
      T44_DATABASE: t44_ci
      AMQP_URL: amqp://t44:ci-mq-disposable@127.0.0.1:5672/t44_ci
      T44_SESSION_TTL_SECONDS: '3600'
    services:
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: ci-root-disposable
          MYSQL_DATABASE: t44_ci
          MYSQL_USER: t44
          MYSQL_PASSWORD: ci-app-disposable
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd "MYSQL_PWD=ci-root-disposable mysql --protocol=tcp --host=127.0.0.1 --user=root --execute='SELECT 1' --silent"
          --health-interval 10s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management-alpine@sha256:0452ee3fd3b9a74160b251e693338616b464f22df4d4ba43304c101bebdca292
        env:
          RABBITMQ_DEFAULT_USER: t44
          RABBITMQ_DEFAULT_PASS: ci-mq-disposable
          RABBITMQ_DEFAULT_VHOST: t44_ci
        ports: ['127.0.0.1:5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: mkdir -p reports/ci/contracts
      - run: python -m pip install --require-hashes -r scripts/ci/requirements.lock
      - name: Require real application and test files
        shell: bash
        run: python scripts/ci/preflight.py 2>&1 | tee reports/ci/contracts/preflight.log
      - name: Install real application dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Apply reviewed schema to explicitly selected disposable test database
        shell: bash
        run: python -m t44.cli migrate --database "$T44_DATABASE" 2>&1 | tee reports/ci/contracts/migration.log
      - name: Run contract, integration and fault tests against real services
        shell: bash
        run: python scripts/ci/run_tests.py contracts 2>&1 | tee reports/ci/contracts/console.log
      - name: Preserve real dependency logs
        if: always()
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
          RABBITMQ_SERVICE_ID: ${{ job.services.rabbitmq.id }}
        shell: bash
        run: |
          docker logs "$MYSQL_SERVICE_ID" > reports/ci/contracts/mysql.log 2>&1
          docker logs "$RABBITMQ_SERVICE_ID" > reports/ci/contracts/rabbitmq.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contracts-${{ github.sha }}
          path: reports/ci/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: mysql+pymysql://t44:ci-app-disposable@127.0.0.1:3306/t44_ci
      T44_DATABASE: t44_ci
      AMQP_URL: amqp://t44:ci-mq-disposable@127.0.0.1:5672/t44_ci
      T44_SESSION_TTL_SECONDS: '3600'
    services:
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: ci-root-disposable
          MYSQL_DATABASE: t44_ci
          MYSQL_USER: t44
          MYSQL_PASSWORD: ci-app-disposable
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd "MYSQL_PWD=ci-root-disposable mysql --protocol=tcp --host=127.0.0.1 --user=root --execute='SELECT 1' --silent"
          --health-interval 10s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management-alpine@sha256:0452ee3fd3b9a74160b251e693338616b464f22df4d4ba43304c101bebdca292
        env:
          RABBITMQ_DEFAULT_USER: t44
          RABBITMQ_DEFAULT_PASS: ci-mq-disposable
          RABBITMQ_DEFAULT_VHOST: t44_ci
        ports: ['127.0.0.1:5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: mkdir -p reports/ci/coverage
      - run: python -m pip install --require-hashes -r scripts/ci/requirements.lock
      - name: Require real application and test files
        shell: bash
        run: python scripts/ci/preflight.py 2>&1 | tee reports/ci/coverage/preflight.log
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Apply reviewed schema to explicitly selected disposable test database
        shell: bash
        run: python -m t44.cli migrate --database "$T44_DATABASE" 2>&1 | tee reports/ci/coverage/migration.log
      - name: Run full suite and cover every production t44 Python module
        # The new differential tests compare with this immutable public source.
        # Checkout is shallow, so request that single reference rather than dropping the comparisons.
        shell: bash
        run: |
          set -euo pipefail
          reference=935ab5b93bea788672c2b4a088c79cfeed848954
          git fetch --no-tags --depth=1 origin "$reference"
          test "$(git rev-parse "${reference}^{commit}")" = "$reference"
          python scripts/ci/run_tests.py coverage 2>&1 | tee reports/ci/coverage/console.log
      - name: Preserve real dependency logs
        if: always()
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
          RABBITMQ_SERVICE_ID: ${{ job.services.rabbitmq.id }}
        shell: bash
        run: |
          docker logs "$MYSQL_SERVICE_ID" > reports/ci/coverage/mysql.log 2>&1
          docker logs "$RABBITMQ_SERVICE_ID" > reports/ci/coverage/rabbitmq.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: reports/ci/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p reports/ci/frontend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Require real frontend manifest and lock
        shell: bash
        run: |
          test -s frontend/package.json && test -s frontend/pnpm-lock.yaml || {
            echo 'MISSING IMPLEMENTATION: frontend/package.json or pnpm-lock.yaml' | tee reports/ci/frontend/preflight.log
            exit 1
          }
      - name: Install frozen frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        shell: bash
        run: pnpm run typecheck 2>&1 | tee ../reports/ci/frontend/typecheck.log
      - name: Production build
        working-directory: frontend
        shell: bash
        run: pnpm run build 2>&1 | tee ../reports/ci/frontend/build.log
      - name: Real Vue/TypeScript tests and full source coverage
        working-directory: frontend
        shell: bash
        run: |
          mkdir -p coverage
          pnpm run test:coverage --reporter=json --outputFile=frontend/coverage/test-results.json \
            --coverage.reporter=json --coverage.reporter=json-summary \
            '--coverage.include=frontend/src/**/*.{ts,vue}' 2>&1 | tee ../reports/ci/frontend/test.log
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require actual passed tests and all TS/Vue production sources at 80 percent
        run: python scripts/ci/check_frontend_coverage.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-${{ github.sha }}
          path: |
            reports/ci/
            frontend/coverage/
          if-no-files-found: error
          retention-days: 14
