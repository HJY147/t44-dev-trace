name: lock-concurrency-diagnostics

on:
  push:
    branches: [codex/lock-diagnostics-20261025]
    paths: [records/diagnostics/20261025/request-locks.json]

permissions:
  contents: read

concurrency:
  group: lock-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finite-lock-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            database: t44_diagnostics
          - mode: candidate
            database: t44_diagnostics
          - mode: http
            database: t44_gate_http
    env:
      PYTHONPATH: backend
      DATABASE_URL: mysql+pymysql://t44:diag-app-disposable@127.0.0.1:3306/${{ matrix.database }}
      T44_DATABASE: ${{ matrix.database }}
      AMQP_URL: amqp://unused:unused@127.0.0.1:5672/unused
    services:
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: diag-root-disposable
          MYSQL_DATABASE: ${{ matrix.database }}
          MYSQL_USER: t44
          MYSQL_PASSWORD: diag-app-disposable
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd "MYSQL_PWD=diag-root-disposable mysql --protocol=tcp --host=127.0.0.1 --user=root --execute='SELECT 1' --silent"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Select explicitly identified baseline Runtime only
        if: matrix.mode == 'baseline'
        run: git show ade5e4c1998b4c2f014afde8c011645c6c5a7412:backend/t44/services/runtime.py > backend/t44/services/runtime.py
      - name: Verify exact application bytes, tool hashes and disposable environment
        run: python tmp/825_lock_ci/825_admission.py '${{ matrix.mode }}'
      - name: Install existing hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements.lock
          python -m pip install --require-hashes -r backend/requirements.lock
      - name: Migrate fresh database and provision narrow diagnostic grants
        run: python tmp/825_lock_ci/825_setup.py '${{ matrix.mode }}'
      - name: Run finite low-level lock probe
        if: matrix.mode != 'http'
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p agents/database/graph-lock-20261025
          if [ "$MODE" = baseline ]; then
            reader=update
            task_shape=batch
            runtime_hash=8802416ee003a464a8433eed80890a1c2069550ff4717ca5e07a10cf2b840b48
          else
            reader=share
            task_shape=point
            runtime_hash=9e0d770e4d5a646b406e1b1a3e328a7e369219d8821dbfcc008303547fe6825b
          fi
          timeout --signal=TERM --kill-after=5s 150s python tmp/833_database_performance/833_mysql_lock_probe.py \
            --allow-fresh-mysql-ci --expected-reader-lock "$reader" --expected-task-lock-shape "$task_shape" \
            --expected-runtime-sha256 "$runtime_hash" \
            --output "agents/database/graph-lock-20261025/mysql-lock-$MODE.json" \
            2>&1 | tee "reports/lock-diagnostics/$MODE/console.log"
      - name: Run seven finite HTTP concurrency cases
        if: matrix.mode == 'http'
        shell: bash
        env:
          T44_GATE_ALLOW_MYSQL: 'true'
          T44_GATE_EXPECTED_SOURCE: ${{ github.sha }}
          T44_GATE_DB_PROBE: tmp/833_database_performance/833_mysql_lock_probe.py
          T44_GATE_DB_PROBE_SHA256: bf9bbedd1dd09196c99ca986a3072a3a506b5b9ffda38f48fc1e5dcd11af37a4
          T44_GATE_REPORT: reports/lock-diagnostics/http/cases.json
        run: |
          timeout --signal=TERM --kill-after=5s 180s python -m pytest -q \
            tmp/834_backend_performance/834_shared_gate_http.py \
            --junitxml=reports/lock-diagnostics/http/junit.xml \
            2>&1 | tee reports/lock-diagnostics/http/console.log
      - name: Preserve fresh MySQL log
        if: always()
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p "reports/lock-diagnostics/$MODE"
          docker logs "$MYSQL_SERVICE_ID" > "reports/lock-diagnostics/$MODE/mysql-service.log" 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lock-${{ matrix.mode }}-${{ github.sha }}
          path: |
            reports/lock-diagnostics/
            agents/database/graph-lock-20261025/mysql-lock-*.json
          if-no-files-found: error
          retention-days: 30
