name: nginx-request-id-candidate

on:
  push:
    branches: [codex/deployment-request-id-chain]
    paths: [agents/deployment/request-id-chain/run-request.json]

permissions:
  contents: read

concurrency:
  group: nginx-request-id-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nginx-request-id:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Real pinned nginx syntax and synthetic raw-header counterexample and candidate
        run: timeout 480s python3 tmp/deployment/840_nginx_request_id.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nginx-request-id-${{ github.sha }}
          path: agents/deployment/request-id-chain/runtime/receipt.json
          if-no-files-found: error
          retention-days: 14
