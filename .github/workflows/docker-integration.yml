name: docker-application

on:
  push:
    branches: [codex/deployment-runtime, codex/integration]
  pull_request:
    branches: [codex/integration]
  workflow_dispatch:
    inputs:
      bundle_source_sha:
        description: Optional exact product SHA for image bundle only; empty runs existing integration
        required: false
        default: ""
        type: string
      source_upgrade_only:
        description: Fixed public935/f4 source context artifact only; no Docker or SUT
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-application:
    if: ${{ inputs.bundle_source_sha == '' && !inputs.source_upgrade_only }}
    name: docker-application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prepare evidence directory
        run: mkdir -p reports/docker-integration
      - name: Real image build, Compose application, private service credential and isolated recovery
        run: python tmp/deployment/972_compose_application.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: docker-application-${{ github.sha }}
          path: reports/docker-integration/
          if-no-files-found: error
          retention-days: 14

  cloud-bundle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_source_sha != '' && !inputs.source_upgrade_only }}
    uses: ./.github/workflows/cloud-image-bundle.yml
    with:
      source_sha: ${{ inputs.bundle_source_sha }}

  offline-source-context:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_upgrade_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fixed public source objects, frozen equality and allowlisted artifact only
        env:
          T44_BUNDLE_SOURCE_INPUT: ${{ inputs.bundle_source_sha }}
        shell: bash
        run: bash deployment/cloud-reuse/prepare-source-artifact.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-backend-source-f4-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/t44-f4-source-artifact/source-backend.tar.gz
            ${{ runner.temp }}/t44-f4-source-artifact/source-manifest.json
            ${{ runner.temp }}/t44-f4-source-artifact/frozen-equality.json
            ${{ runner.temp }}/t44-f4-source-artifact/Dockerfile
            ${{ runner.temp }}/t44-f4-source-artifact/backend-upgrade.py
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
