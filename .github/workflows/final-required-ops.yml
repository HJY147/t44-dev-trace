name: final-required-ops
on:
  push:
    branches: [codex/deployment-final-window]
    paths: [.github/workflows/final-required-ops-request.json]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-required-ops-${{ github.run_id }}
          path: |
            agents/deployment/final-window/delivery/required-ops.tar.gz
            agents/deployment/final-window/delivery/ops-manifest.PUBLIC.json
            agents/deployment/final-window/delivery/delivery.PUBLIC.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
