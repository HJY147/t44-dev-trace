[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "t44-backend"
version = "0.1.0"
description = "T44 synchronous backend and pure delivery workflow domain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL[rsa]>=1.1,<2",
  "pika>=1.3,<2",
  "APScheduler>=3.11,<4",
  "argon2-cffi>=23.1,<26",
  "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "coverage==7.17.0",
  "ruff>=0.12,<1",
  "bandit>=1.8,<2",
  "httpx>=0.28,<1",
  "openapi-spec-validator>=0.7,<1",
  "hatchling>=1.27,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["t44"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
  "contract: requests and responses against a real API contract",
  "integration: real cross-module or external-component integration",
  "fault: injected faults and recovery behavior",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["t44", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
